[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otastctl"
version = "1.0.0rc1"
description = "Host-side validation and packaging tools for OTAST"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
authors = [{name = "cbkii"}]
dependencies = []

[project.scripts]
otastctl = "tools.otastctl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]
