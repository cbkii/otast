name: Agent Finalize Branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'agent/final-upstream-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/final-upstream-refresh
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed semantic updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          maintenance = Path('scripts/otast-maintenance.py')
          text = maintenance.read_text(encoding='utf-8')

          marker = '\n\ndef review_markdown(value: dict[str, Any]) -> str:\n'
          helper = '''\n\ndef classify_review_result(
              comparison: dict[str, Any],
              *,
              active_candidate_compare_rc: int,
              report_rc: int,
              preflight_rc: int,
          ) -> tuple[bool, str, int, str]:
              """Classify immutable upstream-package review evidence.

              An old/new module tree that is byte/mode identical is package-neutral. The
              staged source tree may not model installer-derived runtime topology (notably
              TA-UTL's visible ``TA_utl`` source versus hidden ``.TA_utl`` install form),
              so staged Preflight remains diagnostic in that case rather than a gate.

              Changed package trees always require compatibility review. Comparison/report
              execution failures remain fail-closed validation errors.
              """
              identical = comparison.get("identical") is True
              evidence_ok = active_candidate_compare_rc == 0 and report_rc == 0

              if not identical:
                  return False, "PACKAGE_CHANGED", EXIT_REVIEW, "REQUIRED_FOR_CHANGED_PACKAGE"
              if not evidence_ok:
                  return False, "VALIDATION_FAILED", EXIT_ERROR, "DIAGNOSTIC_ONLY_FOR_IDENTICAL_PACKAGE"
              return True, "NO_PACKAGE_IMPACT", EXIT_OK, "DIAGNOSTIC_ONLY_FOR_IDENTICAL_PACKAGE"
          '''
          if 'def classify_review_result(' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('review_markdown insertion anchor was not unique')
              text = text.replace(marker, helper + marker, 1)

          old_line = '        f"- Preflight status: `{value[\'preflight_rc\']}`",\n'
          new_line = old_line + '        f"- Preflight policy: `{value[\'preflight_policy\']}`",\n'
          if 'Preflight policy:' not in text:
              if text.count(old_line) != 1:
                  raise SystemExit('preflight Markdown anchor was not unique')
              text = text.replace(old_line, new_line, 1)

          old_block = '''    acceptance_ready = (
              comparison["identical"]
              and active_compare.returncode == 0
              and report.returncode == 0
              and preflight.returncode == 0
          )
          if acceptance_ready:
              result_name = "NO_PACKAGE_IMPACT"
              rc = EXIT_OK
          elif not comparison["identical"]:
              result_name = "PACKAGE_CHANGED"
              rc = EXIT_REVIEW
          else:
              result_name = "VALIDATION_FAILED"
              rc = EXIT_ERROR
          '''
          new_block = '''    acceptance_ready, result_name, rc, preflight_policy = classify_review_result(
              comparison,
              active_candidate_compare_rc=active_compare.returncode,
              report_rc=report.returncode,
              preflight_rc=preflight.returncode,
          )
          '''
          if old_block in text:
              if text.count(old_block) != 1:
                  raise SystemExit('review classification block was not unique')
              text = text.replace(old_block, new_block, 1)
          elif new_block not in text:
              raise SystemExit('review classification block matched neither old nor new form')

          result_anchor = '        "preflight_rc": preflight.returncode,\n'
          result_line = result_anchor + '        "preflight_policy": preflight_policy,\n'
          if '"preflight_policy": preflight_policy' not in text:
              if text.count(result_anchor) != 1:
                  raise SystemExit('review JSON anchor was not unique')
              text = text.replace(result_anchor, result_line, 1)

          maintenance.write_text(text, encoding='utf-8', newline='\n')

          doc = Path('docs/MAINTENANCE.md')
          text = doc.read_text(encoding='utf-8')
          old = '- `NO_PACKAGE_IMPACT`: old and new module package trees are byte/mode identical and fake-root validation passed;'
          new = '- `NO_PACKAGE_IMPACT`: old and new immutable module package trees are byte/mode identical and comparison/Report evidence is valid; staged Preflight is retained as diagnostic evidence when static source topology cannot model installer-derived runtime topology;'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('MAINTENANCE.md policy anchor not found')
          doc.write_text(text, encoding='utf-8', newline='\n')

          doc = Path('docs/PIF-COMPATIBILITY.md')
          text = doc.read_text(encoding='utf-8')
          old = 'For the reviewed PIF Inject source at commit `ea93222c58f90108cef0c02a11e66bdfdf4b21b6`, OTAST manages only:'
          new = 'For the reviewed PIF Inject source lineage at commits `ea93222c58f90108cef0c02a11e66bdfdf4b21b6` and `8b4a00cef9536dc9c8428d392725eacf364605a9`, OTAST manages only:'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('PIF lineage anchor not found')

          anchor = '- `security_patch.sh` — exact wrapper because OTAST owns the same TrickyStore and runtime security-patch outputs.\n'
          note = '\nThe `8b4a00ce` review changes only AutoPIF Pixel download-page selection (reverse-sorted FI/OTA URLs). The OTAST transformation anchors and managed writer surfaces are unchanged; the exact new `autopif.sh` source hash is retained as a regression fixture and allowlisted alongside the earlier reviewed sources.\n'
          if note.strip() not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('PIF managed-surface anchor was not unique')
              text = text.replace(anchor, anchor + note, 1)
          doc.write_text(text, encoding='utf-8', newline='\n')
          PY

          git diff --check

      - name: Focused validation
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static
          python3 -m py_compile scripts/otast-maintenance.py tests/test_maintenance.py tests/test_profiles.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v \
            tests.test_maintenance.MaintenanceTests.test_review_classifier_treats_identical_package_preflight_as_diagnostic \
            tests.test_profiles.ProfileTests.test_reviewed_writer_fixtures_match_allowlists \
            tests.test_profiles.ProfileTests.test_current_pif_autopif_transform_preserves_authority_contract
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          fixture = Path('tests/fixtures/upstream/pif-autopif-8b4a00ce.sh')
          assert hashlib.sha256(fixture.read_bytes()).hexdigest() == '04192e43776fb23ff0e132da0f2cb07e99ac0c243d785ace100a64d4ddecd213'
          registry_path = Path('compatibility/supported-targets.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          pif = registry['targets']['playintegrityfix']
          ta = registry['targets']['ta-utl']
          assert pif['monitor']['expected_head'] == '8b4a00cef9536dc9c8428d392725eacf364605a9'
          assert ta['monitor']['expected_head'] == 'eab6fa9104e6a3d895d258b8f976478c81244220'
          assert 'bf0c8c1b0d751c4a7de6632b93e43aca8c0d9f81bbd0dcc6660d8f05808dd40c' not in registry_path.read_text(encoding='utf-8')
          PY

      - name: Commit branch patch
        shell: bash
        run: |
          expected=$'docs/MAINTENANCE.md\ndocs/PIF-COMPATIBILITY.md\nscripts/otast-maintenance.py'
          actual=$(git diff --name-only | LC_ALL=C sort)
          [[ "$actual" == "$expected" ]] || {
            printf 'Unexpected patch scope:\n%s\n' "$actual" >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MAINTENANCE.md docs/PIF-COMPATIBILITY.md scripts/otast-maintenance.py
          git commit -m 'fix(maintenance): classify package-neutral reviews correctly'
          git push origin HEAD:agent/final-upstream-refresh
