name: Target Monitor

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: target-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_DIR: ${{ github.workspace }}/reports/target-monitor-action-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run authenticated target monitor
        id: monitor
        shell: bash
        run: |
          set +e
          python3 scripts/otast-maintenance.py monitor \
            --output "$REPORT_DIR" \
            --no-cleanup
          monitor_rc=$?
          set -e

          echo "rc=$monitor_rc" >>"$GITHUB_OUTPUT"

          case "$monitor_rc" in
            0)
              echo "result=SUPPORTED" >>"$GITHUB_OUTPUT"
              ;;
            10)
              echo "result=REVIEW_REQUIRED" >>"$GITHUB_OUTPUT"
              ;;
            *)
              echo "result=ERROR" >>"$GITHUB_OUTPUT"
              ;;
          esac

      - name: Reconcile target issues
        if: always()
        shell: bash
        run: |
          if [[ -f $REPORT_DIR/target-monitor.json ]]; then
            python3 scripts/otast-maintenance.py issues-sync \
              --report "$REPORT_DIR/target-monitor.json" \
              --repo "$GITHUB_REPOSITORY"
          else
            echo "No monitor JSON was produced; issue reconciliation skipped." >&2
          fi

      - name: Publish workflow summary
        if: always()
        shell: bash
        run: |
          if [[ -f $REPORT_DIR/target-monitor.md ]]; then
            cat "$REPORT_DIR/target-monitor.md" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Target monitor produced no Markdown report." >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload monitor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: target-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Fail only on monitor errors
        if: always() && steps.monitor.outputs.rc != '0' && steps.monitor.outputs.rc != '10'
        shell: bash
        run: |
          echo "Target monitoring failed before a reliable comparison completed." >&2
          exit 1
