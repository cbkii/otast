name: Target monitor

on:
  schedule:
    - cron: '17 3 * * 1,5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: target-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compare reviewed upstream heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/monitor-targets.sh

      - name: Add report to summary
        if: always()
        run: |
          if [[ -f reports/target-monitor/target-monitor.md ]]; then
            cat reports/target-monitor/target-monitor.md >> "$GITHUB_STEP_SUMMARY"
          fi
