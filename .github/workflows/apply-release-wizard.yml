name: Apply Release Wizard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-release-wizard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden:
    if: github.head_ref == 'agent/release-wizard-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/release-wizard-v1
          fetch-depth: 0

      - name: Apply fail-closed hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/release-device.sh')
          text = path.read_text(encoding='utf-8')

          old = '''    case $target in
                  [0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
                  *) fatal "draft target is not an immutable commit SHA: $target"; return 1 ;;
              esac
              [[ ${#target} -eq 40 || ${#target} -eq 64 ]] || { fatal 'draft target commit SHA has wrong length'; return 1; }
          '''
          new = '''    [[ $target =~ ^[0-9a-f]{40}$|^[0-9a-f]{64}$ ]] || {
                  fatal "draft target is not an immutable full commit SHA: $target"
                  return 1
              }
          '''
          if text.count(old) != 1:
              raise SystemExit('draft-target hardening anchor was not unique')
          text = text.replace(old, new, 1)

          old = '''        run_live verify "$LOG_DIR/baseline-verify.log" || {
                  fatal 'existing managed state is not CURRENT; do not auto-restore drifted state'
                  exit $?
              }
              run_live restore "$LOG_DIR/baseline-restore.log" || exit $?
          '''
          new = '''        run_live verify "$LOG_DIR/baseline-verify.log" || {
                  fatal 'existing managed state is not CURRENT; do not auto-restore drifted state'
                  exit $?
              }
              grep -q '^CURRENT[[:space:]]' "$LOG_DIR/baseline-verify.log" || {
                  fatal 'existing managed state Verify returned success without CURRENT evidence'
                  exit $?
              }
              run_live restore "$LOG_DIR/baseline-restore.log" || exit $?
          '''
          if text.count(old) != 1:
              raise SystemExit('baseline CURRENT hardening anchor was not unique')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

          test_path = Path('tests/test_release_device.py')
          tests = test_path.read_text(encoding='utf-8')
          anchor = '''        self.assertIn("existing managed state is not CURRENT", text)
                  self.assertIn("managed state remains after Restore/reboot", text)
          '''
          replacement = '''        self.assertIn("existing managed state is not CURRENT", text)
                  self.assertIn("existing managed state Verify returned success without CURRENT evidence", text)
                  self.assertIn("draft target is not an immutable full commit SHA", text)
                  self.assertIn("managed state remains after Restore/reboot", text)
          '''
          if tests.count(anchor) != 1:
              raise SystemExit('release hardening test anchor was not unique')
          tests = tests.replace(anchor, replacement, 1)
          test_path.write_text(tests, encoding='utf-8', newline='\n')
          PY
          git diff --check
          bash -n scripts/release-device.sh

      - name: Validate hardened implementation
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m tools.otastctl \
            --repo-root "$GITHUB_WORKSPACE" privacy-scan --json

      - name: Commit hardened implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/release-device.sh tests/test_release_device.py
          git diff --cached --check
          git commit -m 'fix(release): harden draft and baseline evidence'
          git push origin HEAD:agent/release-wizard-v1
