name: Apply Release Wizard

on:
  push:
    branches:
      - agent/release-wizard-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-release-wizard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'agent/release-wizard-v1')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/release-wizard-v1
          fetch-depth: 0

      - name: Reconstruct and apply exact patch
        shell: bash
        run: |
          printf '%s  %s\n' 'bcd0888e734bcdf8a6926b0677bb6521de4b5041de44ae9deb55e30c22d401f5' .agent-release-wizard/01a.part | sha256sum -c -
          printf '%s  %s\n' 'a9cb9c05ee54d7deec83a710554ab639c66bd1b3e020fe4ef1e6bbec9e391bdd' .agent-release-wizard/01b.part | sha256sum -c -
          printf '%s  %s\n' '4b60e2888b4fe640b56d5232611898ab1656c385244d61fbdc751b5c9c75635a' .agent-release-wizard/02.patch | sha256sum -c -
          printf '%s  %s\n' 'c60c499eb7b1000dbf4b5cd2d805ef8afdeecc776fe50bbcfd2ee5feba86a93d' .agent-release-wizard/03.patch | sha256sum -c -
          printf '%s  %s\n' 'a75509bdb45ad6e1817328bf6521db051f6a665bfdd2c02cc83f39440bfe2378' .agent-release-wizard/04.patch | sha256sum -c -

          patch="$RUNNER_TEMP/otast-release-wizard.patch"
          cat \
            .agent-release-wizard/01a.part \
            .agent-release-wizard/01b.part \
            .agent-release-wizard/02.patch \
            .agent-release-wizard/03.patch \
            .agent-release-wizard/04.patch \
            >"$patch"
          git apply --check "$patch"
          git apply "$patch"
          git diff --check

      - name: Validate applied source
        shell: bash
        run: |
          bash -n \
            scripts/release-device.sh \
            scripts/otast-playbook.sh \
            scripts/otast-playbook-completion.bash
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m tools.otastctl \
            --repo-root "$GITHUB_WORKSPACE" privacy-scan --json

      - name: Commit validated non-workflow implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docs/INSTALLATION.md \
            docs/PLAYBOOK.md \
            docs/RELEASE.md \
            scripts/otast-playbook-completion.bash \
            scripts/otast-playbook.sh \
            scripts/release-device.sh \
            scripts/validate-device-release-proof.py \
            tests/test_playbook.py \
            tests/test_public_contract.py \
            tests/test_release_device.py
          git diff --cached --check
          git diff --cached --summary
          git commit -m 'feat(release): add resumable physical-device wizard'
          git push origin HEAD:agent/release-wizard-v1
