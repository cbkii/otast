name: Release
run-name: Release ${{ inputs.operation != '' && inputs.operation || inputs.action }} ${{ inputs.version != '' && inputs.version || inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: What do you want to do?
        required: true
        type: choice
        options:
          - prepare-release
          - publish-release
          - build-branch
        default: prepare-release
      branch:
        description: Branch to build (Build branch only; blank = main)
        required: false
        type: string
        default: ''
      tag:
        description: Existing draft tag to publish (Publish release only)
        required: false
        type: string
        default: ''
      operation:
        description: Legacy otast-release operation; leave blank in the Actions UI
        required: false
        type: string
        default: ''
      version:
        description: Legacy otast-release version; leave blank in the Actions UI
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-branch:
    if: inputs.operation == '' && inputs.action == 'build-branch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and checkout selected branch head
        id: source
        shell: bash
        env:
          BRANCH_INPUT: ${{ inputs.branch }}
        run: |
          branch=${BRANCH_INPUT:-main}
          if ! git check-ref-format --branch "$branch" >/dev/null 2>&1; then
            printf 'Invalid branch name: %s\n' "$branch" >&2
            exit 2
          fi
          if ! git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            printf 'Branch does not exist in %s: %s\n' "$GITHUB_REPOSITORY" "$branch" >&2
            exit 1
          fi
          if ! git fetch --no-tags origin "refs/heads/$branch"; then
            printf 'Failed to fetch branch: %s\n' "$branch" >&2
            exit 1
          fi
          if ! git checkout --detach FETCH_HEAD; then
            printf 'Failed to checkout fetched branch head: %s\n' "$branch" >&2
            exit 1
          fi
          resolved=$(git rev-parse HEAD) || exit 1
          printf 'branch=%s\n' "$branch" >>"$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$resolved" >>"$GITHUB_OUTPUT"
          {
            printf '### Branch build source\n\n'
            printf -- '- Branch: `%s`\n' "$branch"
            printf -- '- Commit: `%s`\n' "$resolved"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build branch-head Magisk ZIP without release gating
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if ! python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" build \
              --output dist \
              --commit-sha "$SOURCE_SHA"; then
            printf 'Branch-head Magisk ZIP build failed.\n' >&2
            exit 1
          fi
          shopt -s nullglob
          zips=(dist/otast-v*.zip)
          if ((${#zips[@]} != 1)); then
            printf 'Expected exactly one OTAST Magisk ZIP, found %s.\n' "${#zips[@]}" >&2
            exit 1
          fi
          if ! python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" validate-zip "${zips[0]}"; then
            printf 'Built branch ZIP failed structural Magisk validation.\n' >&2
            exit 1
          fi
          printf 'BRANCH BUILD SUCCESS\n\n' >>"$GITHUB_STEP_SUMMARY"
          printf -- '- Branch: `%s`\n' "${{ steps.source.outputs.branch }}" >>"$GITHUB_STEP_SUMMARY"
          printf -- '- Commit: `%s`\n' "$SOURCE_SHA" >>"$GITHUB_STEP_SUMMARY"
          printf -- '- ZIP: `%s`\n' "${zips[0]#dist/}" >>"$GITHUB_STEP_SUMMARY"
          printf '\nThis build is an Actions artifact only; production release checksum/proof/update gates were intentionally bypassed.\n' >>"$GITHUB_STEP_SUMMARY"

      - name: Upload Magisk ZIP
        uses: actions/upload-artifact@v4
        with:
          name: otast-branch-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/otast-v*.zip
          if-no-files-found: error
          retention-days: 14

  prepare-release:
    if: inputs.operation == 'draft' || (inputs.operation == '' && inputs.action == 'prepare-release')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned shell validators
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static curl xz-utils unzip zip
          archive="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          extracted="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 \
            --output "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$extracted/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
          printf '#!/bin/sh\nexit 0\n' >"$RUNNER_TEMP/shellcheck-busybox-probe.sh"
          shellcheck --shell=busybox "$RUNNER_TEMP/shellcheck-busybox-probe.sh"

      - name: Full main qualification
        run: bash scripts/test.sh --full

      - name: Build canonical release bundle once
        run: bash scripts/build-release.sh

      - name: Verify candidate and resolve release identity
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          LEGACY_VERSION: ${{ inputs.version }}
        run: |
          manifest=dist/release-manifest.json
          version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "$manifest") || exit 1
          source_sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source_commit"])' "$manifest") || exit 1
          zip=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["zip_filename"])' "$manifest") || exit 1
          digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["zip_sha256"])' "$manifest") || exit 1
          if [[ -n $REQUESTED_TAG && $REQUESTED_TAG != "$version" ]]; then
            printf 'Requested tag %s differs from current main module version %s.\n' "$REQUESTED_TAG" "$version" >&2
            exit 1
          fi
          if [[ -n $LEGACY_VERSION && $LEGACY_VERSION != "$version" ]]; then
            printf 'Legacy requested version %s differs from current main module version %s.\n' "$LEGACY_VERSION" "$version" >&2
            exit 1
          fi
          python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" verify-release \
            --zip "dist/$zip" \
            --checksum "dist/$zip.sha256" \
            --manifest "$manifest"
          python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" validate-update-json update.json
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$source_sha" >>"$GITHUB_OUTPUT"
          printf 'zip=%s\n' "$zip" >>"$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"

      - name: Create or refresh unproven draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          ZIP: ${{ steps.release.outputs.zip }}
        run: |
          if [[ "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]]; then
            printf 'Only the repository owner may prepare release drafts.\n' >&2
            exit 1
          fi
          proof="otast-${VERSION}-device-proof.json"
          if existing=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>/dev/null); then
            is_draft=$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())' <<<"$existing") || exit 1
            if [[ $is_draft != true ]]; then
              printf 'Release %s is already published and will not be replaced.\n' "$VERSION" >&2
              exit 1
            fi
            has_proof=$(PROOF_NAME="$proof" python3 -c 'import json,os,sys; data=json.load(sys.stdin); print("yes" if any(a.get("name")==os.environ["PROOF_NAME"] for a in data.get("assets", [])) else "no")' <<<"$existing") || exit 1
            if [[ $has_proof == yes ]]; then
              printf 'Draft %s already contains physical-device proof; proven assets are immutable.\n' "$VERSION" >&2
              exit 1
            fi

            tag_json=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION") || exit 1
            tag_type=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["type"])' <<<"$tag_json") || exit 1
            tag_sha=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])' <<<"$tag_json") || exit 1
            if [[ $tag_type != commit ]]; then
              printf 'Draft tag %s is not a lightweight commit ref; refusing to rewrite it automatically.\n' "$VERSION" >&2
              exit 1
            fi
            if [[ $tag_sha != "$SOURCE_SHA" ]]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$VERSION" \
                -f sha="$SOURCE_SHA" \
                -F force=true >/dev/null
            fi

            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "OTAST $VERSION" \
              --notes-file CHANGELOG.md
            gh release upload "$VERSION" \
              "dist/$ZIP" \
              "dist/$ZIP.sha256" \
              dist/release-manifest.json \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$VERSION" \
              "dist/$ZIP" \
              "dist/$ZIP.sha256" \
              dist/release-manifest.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "OTAST $VERSION" \
              --notes-file CHANGELOG.md \
              --draft
          fi
          [[ "$VERSION" != *-* ]] || gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --prerelease

      - name: Redownload and verify GitHub-hosted draft bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          ZIP: ${{ steps.release.outputs.zip }}
          EXPECTED_SHA: ${{ steps.release.outputs.digest }}
        run: |
          remote="$RUNNER_TEMP/remote-draft"
          rm -rf -- "$remote"
          mkdir -p -- "$remote"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ZIP" \
            --pattern "$ZIP.sha256" \
            --pattern release-manifest.json \
            --dir "$remote"
          python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" verify-release \
            --zip "$remote/$ZIP" \
            --checksum "$remote/$ZIP.sha256" \
            --manifest "$remote/release-manifest.json"
          remote_sha=$(sha256sum "$remote/$ZIP" | awk '{print $1}') || exit 1
          [[ $remote_sha == "$EXPECTED_SHA" ]] || {
            printf 'Downloaded draft ZIP differs from the locally qualified ZIP.\n' >&2
            exit 1
          }
          tag_json=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION") || exit 1
          tag_type=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["type"])' <<<"$tag_json") || exit 1
          tag_sha=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])' <<<"$tag_json") || exit 1
          [[ $tag_type == commit && $tag_sha == "$SOURCE_SHA" ]] || {
            printf 'Draft tag %s does not resolve directly to qualified source %s.\n' "$VERSION" "$SOURCE_SHA" >&2
            exit 1
          }
          {
            printf '## DRAFT READY FOR PHYSICAL QUALIFICATION\n\n'
            printf -- '- Version: `%s`\n' "$VERSION"
            printf -- '- Source: `%s`\n' "$SOURCE_SHA"
            printf -- '- ZIP: `%s`\n' "$ZIP"
            printf -- '- SHA-256: `%s`\n' "$EXPECTED_SHA"
            printf '\nNext: run `otast release` against this exact draft.\n'
          } >>"$GITHUB_STEP_SUMMARY"

  publish-release:
    if: inputs.operation == 'publish' || (inputs.operation == '' && inputs.action == 'publish-release')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout current main validator
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Resolve requested release tag
        id: release
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
          LEGACY_VERSION: ${{ inputs.version }}
        run: |
          version=${TAG_INPUT:-$LEGACY_VERSION}
          if [[ ! $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            printf 'Publish release requires a valid tag such as v1.0.0.\n' >&2
            exit 2
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Validate exact release bundle and physical-device proof
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]]; then
            printf 'Only the repository owner may publish.\n' >&2
            exit 1
          fi
          release_json=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName) || exit 1
          tag=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["tagName"])' <<<"$release_json") || exit 1
          [[ $tag == "$VERSION" ]] || { printf 'Release tag mismatch.\n' >&2; exit 1; }

          assets="$RUNNER_TEMP/release-assets"
          rm -rf -- "$assets"
          mkdir -p -- "$assets"
          zip="otast-${VERSION}.zip"
          proof="otast-${VERSION}-device-proof.json"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "$zip" \
            --pattern "$zip.sha256" \
            --pattern release-manifest.json \
            --pattern "$proof" \
            --dir "$assets"
          python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" verify-release \
            --zip "$assets/$zip" \
            --checksum "$assets/$zip.sha256" \
            --manifest "$assets/release-manifest.json"
          python3 scripts/validate-device-release-proof.py \
            --proof "$assets/$proof" \
            --module-zip "$assets/$zip" \
            --version "$VERSION"
          digest=$(sha256sum "$assets/$zip" | awk '{print $1}') || exit 1
          printf 'assets=%s\n' "$assets" >>"$GITHUB_OUTPUT"
          printf 'zip=%s\n' "$zip" >>"$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"

      - name: Publish the already-proven draft without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          is_draft=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) || exit 1
          if [[ $is_draft == true ]]; then
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          else
            printf 'Release %s is already published; continuing with idempotent updater-channel verification.\n' "$VERSION"
          fi

      - name: Synchronize stable Magisk update metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          ASSETS: ${{ steps.validate.outputs.assets }}
          ZIP: ${{ steps.validate.outputs.zip }}
          EXPECTED_SHA: ${{ steps.validate.outputs.digest }}
        run: |
          published=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,assets) || exit 1
          is_draft=$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())' <<<"$published") || exit 1
          [[ $is_draft == false ]] || { printf 'Release is still a draft after publication step.\n' >&2; exit 1; }
          has_zip=$(ZIP="$ZIP" python3 -c 'import json,os,sys; data=json.load(sys.stdin); print("yes" if any(a.get("name")==os.environ["ZIP"] for a in data.get("assets", [])) else "no")' <<<"$published") || exit 1
          [[ $has_zip == yes ]] || { printf 'Published release is missing expected Magisk ZIP.\n' >&2; exit 1; }

          expected="$RUNNER_TEMP/update.json.expected"
          python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" generate-update-json \
            --manifest "$ASSETS/release-manifest.json" \
            --output "$expected" >/dev/null
          python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" validate-update-json "$expected" >/dev/null

          current_payload=$(gh api "repos/$GITHUB_REPOSITORY/contents/update.json?ref=main") || exit 1
          current_sha=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' <<<"$current_payload") || exit 1
          current_file="$RUNNER_TEMP/update.json.current"
          python3 -c 'import base64,json,sys; p=json.load(sys.stdin); open(sys.argv[1],"wb").write(base64.b64decode(p["content"]))' "$current_file" <<<"$current_payload" || exit 1
          python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" validate-update-json "$current_file" >/dev/null

          current_code=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["versionCode"])' "$current_file") || exit 1
          next_code=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["versionCode"])' "$expected") || exit 1
          if ((current_code > next_code)); then
            printf 'Stable update channel already advertises newer versionCode %s; refusing downgrade to %s.\n' "$current_code" "$next_code" >&2
            exit 1
          fi
          if ((current_code == next_code)); then
            if ! python3 -c 'import json,sys; raise SystemExit(0 if json.load(open(sys.argv[1], encoding="utf-8")) == json.load(open(sys.argv[2], encoding="utf-8")) else 1)' "$current_file" "$expected"; then
              printf 'Stable update channel has conflicting metadata at versionCode %s.\n' "$current_code" >&2
              exit 1
            fi
          else
            encoded=$(python3 -c 'import base64,sys; print(base64.b64encode(open(sys.argv[1],"rb").read()).decode())' "$expected") || exit 1
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/update.json" \
              -f message="chore(release): publish Magisk updater metadata $VERSION" \
              -f content="$encoded" \
              -f sha="$current_sha" \
              -f branch=main >/dev/null
          fi

          verified_payload=$(gh api "repos/$GITHUB_REPOSITORY/contents/update.json?ref=main") || exit 1
          verified="$RUNNER_TEMP/update.json.verified"
          python3 -c 'import base64,json,sys; p=json.load(sys.stdin); open(sys.argv[1],"wb").write(base64.b64decode(p["content"]))' "$verified" <<<"$verified_payload" || exit 1
          if ! python3 -c 'import json,sys; raise SystemExit(0 if json.load(open(sys.argv[1], encoding="utf-8")) == json.load(open(sys.argv[2], encoding="utf-8")) else 1)' "$verified" "$expected"; then
            printf 'Published Magisk update metadata does not match the proven release.\n' >&2
            exit 1
          fi
          python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" validate-update-json "$verified" >/dev/null

          remote="$RUNNER_TEMP/published-asset"
          rm -rf -- "$remote"
          mkdir -p -- "$remote"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$ZIP" --dir "$remote"
          published_sha=$(sha256sum "$remote/$ZIP" | awk '{print $1}') || exit 1
          [[ $published_sha == "$EXPECTED_SHA" ]] || {
            printf 'Published ZIP digest differs from the physically proven ZIP.\n' >&2
            exit 1
          }
          {
            printf '## RELEASE %s PUBLISHED\n\n' "$VERSION"
            printf -- '- ZIP: `%s`\n' "$ZIP"
            printf -- '- SHA-256: `%s`\n' "$EXPECTED_SHA"
            printf -- '- Magisk update channel: `https://raw.githubusercontent.com/%s/main/update.json`\n' "$GITHUB_REPOSITORY"
          } >>"$GITHUB_STEP_SUMMARY"
