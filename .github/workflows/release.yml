name: Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate only or publish the current module version
        required: true
        type: choice
        options: [validate, publish]
        default: validate
      version:
        description: Exact module version, for example v1.0.0-rc.2
        required: true
        type: string
        default: v1.0.0
      draft:
        description: Create the GitHub release as a draft
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned shell validators
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static curl xz-utils unzip zip
          archive="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          extracted="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 \
            --output "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$extracted/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
          printf '#!/bin/sh\nexit 0\n' >"$RUNNER_TEMP/shellcheck-busybox-probe.sh"
          shellcheck --shell=busybox "$RUNNER_TEMP/shellcheck-busybox-probe.sh"

      - name: Verify requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          module_version=$(awk -F= '$1 == "version" {print $2}' module/module.prop)
          [[ "$module_version" == "$REQUESTED_VERSION" ]] || {
            printf 'Requested version %s differs from module.prop %s\n' "$REQUESTED_VERSION" "$module_version" >&2
            exit 1
          }
          [[ "$REQUESTED_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]] || exit 1

      - name: Full exact-package qualification
        run: bash scripts/test.sh --full

      - name: Build release assets
        run: bash scripts/build-release.sh

      - name: Summarize assets
        run: |
          sha256sum dist/otast-*.zip | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish owner-requested release
        if: inputs.operation == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DRAFT: ${{ inputs.draft }}
        run: |
          [[ "$GITHUB_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]] || {
            printf 'Only the repository owner may publish.\n' >&2
            exit 1
          }
          args=(release create "$VERSION" "dist/otast-${VERSION}.zip" "dist/otast-${VERSION}.zip.sha256" --target "$GITHUB_SHA" --title "OTAST $VERSION" --notes-file CHANGELOG.md)
          [[ "$DRAFT" == true ]] && args+=(--draft)
          [[ "$VERSION" == *-* ]] && args+=(--prerelease)
          gh "${args[@]}"
