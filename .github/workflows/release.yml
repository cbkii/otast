name: Release
run-name: Release ${{ inputs.version != '' && inputs.version || 'auto' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (blank = next stable patch)
        required: false
        type: string
        default: ''
      full_validation:
        description: Run full test/fake-root qualification (always required for stable)
        required: true
        type: boolean
        default: false
      physical_proof:
        description: Require physical Pixel proof for prerelease too (always required for stable)
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Require repository owner
        shell: bash
        run: |
          if [[ "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]]; then
            printf 'Only the repository owner may publish OTAST releases.\n' >&2
            exit 1
          fi

      - name: Checkout authoritative main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install release tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static unzip zip curl xz-utils

      - name: Install pinned shell validators
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        shell: bash
        run: |
          archive="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          extracted="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 \
            --output "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$extracted/shellcheck" /usr/local/bin/shellcheck

      - name: Resolve release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" resolve-release-version \
            --requested "$REQUESTED_VERSION" >"$RUNNER_TEMP/version.json"
          python3 - "$RUNNER_TEMP/version.json" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          with open(sys.argv[2], "a", encoding="utf-8") as out:
              for key in ("version", "version_code", "stable_version", "prerelease"):
                  item = value[key]
                  if isinstance(item, bool):
                      item = str(item).lower()
                  out.write(f"{key}={item}\n")
          with open(sys.argv[3], "a", encoding="utf-8") as summary:
              summary.write("## OTAST release\n\n")
              summary.write(f"- Stable: `{value['stable_version']}`\n")
              summary.write(f"- Candidate: `{value['version']}`\n")
              summary.write(f"- VersionCode: `{value['version_code']}`\n")
          PY

      - name: Inspect existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,assets,targetCommitish >"$RUNNER_TEMP/existing.json" 2>/dev/null; then
            python3 - "$RUNNER_TEMP/existing.json" "$GITHUB_OUTPUT" "$VERSION" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          version = sys.argv[3]
          proof = f"otast-{version}-device-proof.json"
          names = {item.get("name") for item in value.get("assets", []) if isinstance(item, dict)}
          with open(sys.argv[2], "a", encoding="utf-8") as out:
              out.write("exists=true\n")
              out.write(f"draft={str(bool(value.get('isDraft'))).lower()}\n")
              out.write(f"published={str(not bool(value.get('isDraft'))).lower()}\n")
              out.write(f"proof_present={str(proof in names).lower()}\n")
              out.write(f"target={value.get('targetCommitish') or ''}\n")
          PY
          else
            printf 'exists=false\ndraft=false\npublished=false\nproof_present=false\ntarget=\n' >>"$GITHUB_OUTPUT"
          fi

      - name: Fresh compatibility target monitor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          monitor="$GITHUB_WORKSPACE/reports/release-target-monitor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$monitor"
          monitor_rc=0
          python3 scripts/otast-maintenance.py monitor --output "$monitor" --no-cleanup || monitor_rc=$?
          if ((monitor_rc == 0)); then
            printf 'FRESH TARGET MONITOR: SUPPORTED\n' >>"$GITHUB_STEP_SUMMARY"
          elif ((monitor_rc == 10)); then
            [[ ! -f $monitor/target-monitor.md ]] || cat "$monitor/target-monitor.md" >>"$GITHUB_STEP_SUMMARY"
            gate_rc=0
            python3 scripts/release-target-gate.py \
              --repo-root "$GITHUB_WORKSPACE" \
              --monitor-json "$monitor/target-monitor.json" \
              --output "$monitor" || gate_rc=$?
            [[ ! -f $monitor/release-target-gate.md ]] || cat "$monitor/release-target-gate.md" >>"$GITHUB_STEP_SUMMARY"
            if ((gate_rc == 0)); then
              printf 'FRESH TARGET MONITOR: RELEASE-SAFE; PINNED RELEASE ARTIFACTS VERIFIED\n' >>"$GITHUB_STEP_SUMMARY"
            else
              printf 'Fresh target/dependency gate blocked release qualification (status %s).\n' "$gate_rc" >&2
              exit "$gate_rc"
            fi
          else
            [[ ! -f $monitor/target-monitor.md ]] || cat "$monitor/target-monitor.md" >>"$GITHUB_STEP_SUMMARY"
            printf 'Fresh target/dependency monitor failed (status %s).\n' "$monitor_rc" >&2
            exit "$monitor_rc"
          fi

      - name: Upload target-monitor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-target-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/reports/release-target-monitor-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Generate release notes
        if: steps.existing.outputs.exists != 'true'
        env:
          STABLE_VERSION: ${{ steps.version.outputs.stable_version }}
        shell: bash
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if git rev-parse --verify "$STABLE_VERSION^{commit}" >/dev/null 2>&1; then
            git log "$STABLE_VERSION"..HEAD --no-merges --pretty='%s'
          else
            git log -30 --no-merges --pretty='%s'
          fi | grep -Ev '^chore\(release\): (prepare|publish) ' | sed 's/^/- /' >"$notes" || true
          if [[ ! -s $notes ]]; then
            printf '%s\n' '- Release metadata and validated package refresh.' >"$notes"
          fi

      - name: Stamp candidate metadata
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" stamp-release \
            --version "$VERSION" --version-code "$VERSION_CODE" \
            --notes-file "$RUNNER_TEMP/release-notes.md" >/dev/null

      - name: New-candidate source integrity
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p 'test_release_bundle.py' -v
          python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" verify >/dev/null
          printf 'NEW CANDIDATE SOURCE INTEGRITY: PASS\n' >>"$GITHUB_STEP_SUMMARY"

      - name: Full repository qualification
        if: steps.existing.outputs.exists != 'true' && (inputs.full_validation || steps.version.outputs.prerelease != 'true')
        shell: bash
        run: |
          bash scripts/test.sh --full
          printf 'FULL VALIDATION: PASS\n' >>"$GITHUB_STEP_SUMMARY"

      - name: Record skipped full qualification
        if: steps.existing.outputs.exists != 'true' && !inputs.full_validation && steps.version.outputs.prerelease == 'true'
        shell: bash
        run: |
          printf 'FULL VALIDATION: SKIPPED (explicit prerelease fast path)\n' >>"$GITHUB_STEP_SUMMARY"

      - name: Persist version bump to main
        if: steps.existing.outputs.exists != 'true'
        id: source
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          base=$(git rev-parse HEAD)
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add module/module.prop CHANGELOG.md
          if git diff --cached --quiet; then
            source_sha=$base
          else
            git commit -m "chore(release): prepare $VERSION"
            source_sha=$(git rev-parse HEAD)
            remote_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
            [[ $remote_main == "$base" ]] || {
              printf 'main moved during release preparation; rerun Release against the new main.\n' >&2
              exit 1
            }
            git push origin HEAD:main
          fi
          observed_version=$(sed -n 's/^version=//p' module/module.prop | sed -n '1p')
          observed_code=$(sed -n 's/^versionCode=//p' module/module.prop | sed -n '1p')
          [[ $observed_version == "$VERSION" && $observed_code == "$VERSION_CODE" ]] || {
            printf 'Persisted module identity does not match resolved release.\n' >&2
            exit 1
          }
          printf 'sha=%s\n' "$source_sha" >>"$GITHUB_OUTPUT"

      - name: Build canonical bundle
        if: steps.existing.outputs.exists != 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          rm -rf -- dist
          bash scripts/build-release.sh
          recorded=$(python3 -c 'import json; print(json.load(open("dist/release-manifest.json"))["source_commit"])')
          [[ $recorded == "$SOURCE_SHA" ]] || {
            printf 'Release manifest source does not match persisted release commit.\n' >&2
            exit 1
          }

      - name: Create hosted draft
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          zip=$(python3 -c 'import json; print(json.load(open("dist/release-manifest.json"))["zip_filename"])')
          gh release create "$VERSION" "dist/$zip" "dist/$zip.sha256" dist/release-manifest.json \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "OTAST $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --draft

      - name: Mandatory hosted release integrity
        id: hosted
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_CODE: ${{ steps.version.outputs.version_code }}
          REQUIRE_PROOF: ${{ inputs.physical_proof }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          assets="$RUNNER_TEMP/hosted"
          rm -rf -- "$assets"
          mkdir -p -- "$assets"
          zip="otast-${VERSION}.zip"
          proof="otast-${VERSION}-device-proof.json"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "$zip" --pattern "$zip.sha256" --pattern release-manifest.json --dir "$assets"
          python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" verify-release \
            --zip "$assets/$zip" --checksum "$assets/$zip.sha256" --manifest "$assets/release-manifest.json" >/dev/null

          python3 - "$assets/release-manifest.json" "$VERSION" "$EXPECTED_CODE" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          version, code = sys.argv[2], int(sys.argv[3])
          if manifest["version"] != version or manifest["version_code"] != code:
              raise SystemExit("Hosted bundle identity does not match resolved release")
          with open(sys.argv[4], "a", encoding="utf-8") as out:
              out.write(f"source={manifest['source_commit']}\n")
              out.write(f"digest={manifest['zip_sha256']}\n")
              out.write(f"prerelease={str('-' in version).lower()}\n")
              out.write(f"assets={sys.argv[1].rsplit('/', 1)[0]}\n")
          PY

          release=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,assets,targetCommitish)
          draft=$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())' <<<"$release")
          target=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("targetCommitish") or "")' <<<"$release")
          source=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_commit"])' "$assets/release-manifest.json")
          if [[ $draft == true && $target != "$source" ]]; then
            printf 'Hosted draft target does not match manifest source: target=%s source=%s\n' "$target" "$source" >&2
            exit 1
          fi
          has_proof=$(PROOF="$proof" python3 -c 'import json,os,sys; v=json.load(sys.stdin); print("true" if any(a.get("name")==os.environ["PROOF"] for a in v.get("assets", [])) else "false")' <<<"$release")
          if [[ $has_proof == true ]]; then
            gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$proof" --dir "$assets"
            python3 scripts/validate-device-release-proof.py \
              --proof "$assets/$proof" --module-zip "$assets/$zip" --version "$VERSION"
          fi

          if [[ $has_proof != true && ($PRERELEASE != true || $REQUIRE_PROOF == true) ]]; then
            printf 'publish=false\n' >>"$GITHUB_OUTPUT"
            {
              printf '## DRAFT READY — PHYSICAL PROOF REQUIRED\n\n'
              printf 'Stable releases always require the exact Pixel proof. Prereleases require it when the workflow input is enabled. Run the Pixel proof flow, then rerun this same Release workflow with the same version.\n'
            } >>"$GITHUB_STEP_SUMMARY"
          else
            printf 'publish=true\n' >>"$GITHUB_OUTPUT"
          fi
          printf 'draft=%s\nproof_present=%s\n' "$draft" "$has_proof" >>"$GITHUB_OUTPUT"
          printf 'HOSTED RELEASE INTEGRITY: PASS\n' >>"$GITHUB_STEP_SUMMARY"

      - name: Publish verified release
        if: steps.hosted.outputs.publish == 'true' && steps.hosted.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.hosted.outputs.prerelease }}
        shell: bash
        run: |
          if [[ $PRERELEASE == true ]]; then
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

      - name: Verify published identity
        if: steps.hosted.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.hosted.outputs.source }}
        shell: bash
        run: |
          release=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft)
          draft=$(python3 -c 'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())' <<<"$release")
          [[ $draft == false ]] || { printf 'Release is still a draft.\n' >&2; exit 1; }
          git fetch --force --no-tags origin "refs/tags/$VERSION:refs/tags/$VERSION"
          tag_sha=$(git rev-list -n 1 "$VERSION")
          [[ $tag_sha == "$SOURCE_SHA" ]] || {
            printf 'Published tag source mismatch: expected=%s observed=%s\n' "$SOURCE_SHA" "$tag_sha" >&2
            exit 1
          }
          printf 'HOSTED RELEASE IDENTITY: PASS\n' >>"$GITHUB_STEP_SUMMARY"

      - name: Update stable Magisk channel
        if: steps.hosted.outputs.publish == 'true' && steps.hosted.outputs.prerelease != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          assets=${{ steps.hosted.outputs.assets }}
          python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" generate-update-json \
            --manifest "$assets/release-manifest.json" --output "$RUNNER_TEMP/update.json" >/dev/null

          git fetch --no-tags origin main
          git checkout -B release-update origin/main
          python3 - "$RUNNER_TEMP/update.json" update.json <<'PY'
          import sys
          from pathlib import Path
          from tools.otastctl.release import load_update_metadata, version_core
          new = load_update_metadata(Path(sys.argv[1]))
          old = load_update_metadata(Path(sys.argv[2]))
          if version_core(str(old["version"])) > version_core(str(new["version"])):
              raise SystemExit("Refusing stable updater downgrade")
          if old["version"] == new["version"] and old != new:
              raise SystemExit("Existing stable updater conflicts with published release")
          PY

          observed_version=$(sed -n 's/^version=//p' module/module.prop | sed -n '1p')
          observed_code=$(sed -n 's/^versionCode=//p' module/module.prop | sed -n '1p')
          [[ $observed_version == "$VERSION" && $observed_code == "$VERSION_CODE" ]] || {
            printf 'Latest main no longer carries this release identity; updater not changed.\n' >&2
            exit 1
          }
          cp -- "$RUNNER_TEMP/update.json" update.json
          python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" validate-update-json update.json >/dev/null
          git add update.json
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "chore(release): publish Magisk updater metadata $VERSION"
            git push origin HEAD:main
          fi
          printf 'STABLE UPDATE CHANNEL: PASS\n' >>"$GITHUB_STEP_SUMMARY"

      - name: Final summary
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH: ${{ steps.hosted.outputs.publish }}
          PROOF: ${{ inputs.physical_proof }}
          FULL: ${{ inputs.full_validation }}
          STATUS: ${{ job.status }}
        shell: bash
        run: |
          {
            printf '\n## Result\n\n'
            printf -- '- Version: `%s`\n' "${VERSION:-unresolved}"
            printf -- '- Workflow status: `%s`\n' "$STATUS"
            printf -- '- Full validation requested: `%s`\n' "$FULL"
            printf -- '- Physical proof input: `%s` (stable is always required)\n' "$PROOF"
            if [[ $STATUS == success && $PUBLISH == true ]]; then
              printf -- '- Release: `PUBLISHED`\n'
            elif [[ $STATUS == success ]]; then
              printf -- '- Release: `DRAFT / AWAITING PHYSICAL PROOF`\n'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
