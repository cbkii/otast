name: Apply Flexible Release

on:
  push:
    branches:
      - agent/flexible-self-healing-release

permissions:
  contents: write

concurrency:
  group: apply-flex-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/flexible-self-healing-release
          fetch-depth: 0

      - name: Reconstruct verified payload
        shell: bash
        run: |
          printf '%s  %s\n' '0b9d0684e4f317c08309f6ca98ecd25bd5f0631456c22b339e68d9853b004e15' .agent-flex-release/payload.part.00 | sha256sum -c -
          printf '%s  %s\n' '113951f94fe711e9e39e744f4c9a6dd6f947ca9ee6e1254dbc4d64dd53f65d43' .agent-flex-release/payload.part.01 | sha256sum -c -
          printf '%s  %s\n' 'bad888fe21e7c319167bf49af6d36f953db00351170654731b8e6cbbd971f22a' .agent-flex-release/payload.part.02 | sha256sum -c -
          printf '%s  %s\n' '281e6d3b7a8e84137188b09732ae2f0cd9393c91fd9b237372ccda8f0f785a6b' .agent-flex-release/payload.part.03 | sha256sum -c -

          cat .agent-flex-release/payload.part.* >"$RUNNER_TEMP/payload.b64"
          printf '%s  %s\n' 'e32da53948bfef45f39f09b3c6bbd3431877fc50e8be01d7d6c9b2ea1eca9a4f' "$RUNNER_TEMP/payload.b64" | sha256sum -c -
          base64 -d "$RUNNER_TEMP/payload.b64" >"$RUNNER_TEMP/payload.tar.gz"
          printf '%s  %s\n' '00dc867bd7533443d16b4458a7d8339aa972278e753aee093a26ac7c5914133a' "$RUNNER_TEMP/payload.tar.gz" | sha256sum -c -

          mkdir -p "$RUNNER_TEMP/payload"
          tar -xzf "$RUNNER_TEMP/payload.tar.gz" -C "$RUNNER_TEMP/payload"
          find "$RUNNER_TEMP/payload" -type f -print | LC_ALL=C sort

      - name: Install payload with explicit modes
        shell: bash
        run: |
          install -m 0755 "$RUNNER_TEMP/payload/scripts/release-device.sh" scripts/release-device.sh
          install -m 0755 "$RUNNER_TEMP/payload/scripts/validate-device-release-proof.py" scripts/validate-device-release-proof.py
          install -m 0644 "$RUNNER_TEMP/payload/tests/test_release_device.py" tests/test_release_device.py
          install -m 0644 "$RUNNER_TEMP/payload/docs/RELEASE.md" docs/RELEASE.md
          install -m 0644 "$RUNNER_TEMP/payload/docs/INSTALLATION.md" docs/INSTALLATION.md
          git diff --check
          bash -n scripts/release-device.sh
          python3 -m py_compile scripts/validate-device-release-proof.py

      - name: Validate flexible release implementation
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" privacy-scan --json

      - name: Commit validated non-workflow files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            scripts/release-device.sh \
            scripts/validate-device-release-proof.py \
            tests/test_release_device.py \
            docs/RELEASE.md \
            docs/INSTALLATION.md
          git diff --cached --check
          git diff --cached --summary
          git commit -m 'fix(release): follow latest main and self-heal common failures'
          git push origin HEAD:agent/flexible-self-healing-release
