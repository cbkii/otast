name: Release Readiness Report
run-name: Release readiness · latest main · ${{ github.run_number }}.${{ github.run_attempt }}

on:
  workflow_dispatch:
    inputs:
      include_target_monitor:
        description: Check reviewed upstream target heads
        required: true
        type: boolean
        default: true
      build_release_asset:
        description: Build and inspect the current module ZIP
        required: true
        type: boolean
        default: true
      fail_on_error:
        description: Mark the run failed when a critical readiness stage fails
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-readiness-${{ github.repository }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_ROOT: ${{ github.workspace }}/reports/release-readiness-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Capture source and run metadata
        id: metadata
        continue-on-error: true
        shell: bash
        run: |
          stage="$REPORT_ROOT/00-metadata"
          mkdir -p -- "$stage"
          exec > >(tee "$stage/metadata.log") 2>&1

          rc=0
          version=$(sed -n 's/^version=//p' module/module.prop | sed -n '1p') || rc=$?
          version_code=$(sed -n 's/^versionCode=//p' module/module.prop | sed -n '1p') || rc=$?
          head=$(git rev-parse HEAD 2>/dev/null) || rc=$?

          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'workflow_run=%s/%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'source_ref=main\n'
            printf 'source_head=%s\n' "${head:-unknown}"
            printf 'version=%s\n' "${version:-unknown}"
            printf 'version_code=%s\n' "${version_code:-unknown}"
            printf 'actor=%s\n' "$GITHUB_ACTOR"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'python=%s\n' "$(python3 --version 2>&1)"
            printf 'git=%s\n' "$(git --version 2>&1)"
          } | tee "$stage/metadata.env"

          git status --short --branch >"$stage/git-status.txt" 2>&1 || rc=$?
          git log -1 --decorate --stat >"$stage/head-commit.txt" 2>&1 || rc=$?
          cp -- module/module.prop "$stage/module.prop" || rc=$?
          cp -- update.json "$stage/update.json" || rc=$?

          printf '%s\n' "$rc" >"$stage/rc"
          printf 'version=%s\n' "${version:-unknown}" >>"$GITHUB_OUTPUT"
          printf 'head=%s\n' "${head:-unknown}" >>"$GITHUB_OUTPUT"
          exit "$rc"

      - name: Upload metadata evidence
        id: upload_metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-00-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_ROOT }}/00-metadata
          if-no-files-found: warn
          retention-days: 14

      - name: Install pinned validation toolchain
        id: toolchain
        continue-on-error: true
        shell: bash
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          stage="$REPORT_ROOT/01-toolchain"
          mkdir -p -- "$stage"
          exec > >(tee "$stage/toolchain.log") 2>&1

          rc=0
          sudo apt-get update || rc=$?
          if ((rc == 0)); then
            sudo apt-get install -y busybox-static curl xz-utils unzip zip || rc=$?
          fi

          archive="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          extracted="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}"

          if ((rc == 0)); then
            curl \
              --fail \
              --location \
              --retry 3 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 300 \
              --output "$archive" \
              "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" || rc=$?
          fi
          if ((rc == 0)); then
            printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum -c - || rc=$?
          fi
          if ((rc == 0)); then
            tar -xJf "$archive" -C "$RUNNER_TEMP" || rc=$?
          fi
          if ((rc == 0)); then
            sudo install -m 0755 "$extracted/shellcheck" /usr/local/bin/shellcheck || rc=$?
          fi
          if ((rc == 0)); then
            shellcheck --version | tee "$stage/shellcheck-version.txt" || rc=$?
            busybox | head -n 1 | tee "$stage/busybox-version.txt" || true
            printf '#!/bin/sh\nexit 0\n' >"$RUNNER_TEMP/shellcheck-busybox-probe.sh"
            shellcheck --shell=busybox "$RUNNER_TEMP/shellcheck-busybox-probe.sh" || rc=$?
          fi

          printf '%s\n' "$rc" >"$stage/rc"
          exit "$rc"

      - name: Upload toolchain evidence
        id: upload_toolchain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-01-toolchain-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_ROOT }}/01-toolchain
          if-no-files-found: warn
          retention-days: 14

      - name: Run full repository and fake-root gate
        id: full_validation
        continue-on-error: true
        shell: bash
        run: |
          stage="$REPORT_ROOT/02-full-validation"
          mkdir -p -- "$stage"
          exec > >(tee "$stage/full-validation.log") 2>&1

          rc=0
          bash scripts/test.sh --full || rc=$?
          printf '%s\n' "$rc" >"$stage/rc"
          exit "$rc"

      - name: Upload full-validation evidence
        id: upload_full_validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-02-full-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_ROOT }}/02-full-validation
          if-no-files-found: warn
          retention-days: 14

      - name: Run explicit public privacy audit
        id: privacy_audit
        continue-on-error: true
        shell: bash
        run: |
          stage="$REPORT_ROOT/03-public-privacy"
          mkdir -p -- "$stage"
          exec > >(tee "$stage/privacy-audit.log") 2>&1

          rc=0
          if python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" privacy-scan --json \
              >"$stage/privacy.json" 2>"$stage/privacy.stderr"; then
            cat "$stage/privacy.json"
          else
            rc=$?
            cat "$stage/privacy.stderr" >&2
          fi

          printf '%s\n' "$rc" >"$stage/rc"
          exit "$rc"

      - name: Upload privacy-audit evidence
        id: upload_privacy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-03-public-privacy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_ROOT }}/03-public-privacy
          if-no-files-found: warn
          retention-days: 14

      - name: Check reviewed upstream targets
        id: target_monitor
        if: ${{ inputs.include_target_monitor }}
        continue-on-error: true
        shell: bash
        run: |
          stage="$REPORT_ROOT/04-target-monitor"
          mkdir -p -- "$stage"
          exec > >(tee "$stage/target-monitor.log") 2>&1

          monitor_rc=0
          python3 scripts/otast-maintenance.py monitor \
            --output "$stage/report" \
            --no-cleanup || monitor_rc=$?

          case "$monitor_rc" in
            0)
              result=SUPPORTED
              step_rc=0
              ;;
            10)
              result=REVIEW_REQUIRED
              step_rc=0
              ;;
            *)
              result=ERROR
              step_rc=$monitor_rc
              ;;
          esac

          printf '%s\n' "$monitor_rc" >"$stage/monitor.rc"
          printf '%s\n' "$result" >"$stage/result"
          printf 'result=%s\n' "$result" >>"$GITHUB_OUTPUT"
          printf 'monitor_rc=%s\n' "$monitor_rc" >>"$GITHUB_OUTPUT"
          exit "$step_rc"

      - name: Upload target-monitor evidence
        id: upload_target_monitor
        if: always() && inputs.include_target_monitor
        uses: actions/upload-artifact@v4
        with:
          name: readiness-04-target-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_ROOT }}/04-target-monitor
          if-no-files-found: warn
          retention-days: 14

      - name: Build and inspect release asset
        id: build_release
        if: ${{ inputs.build_release_asset }}
        continue-on-error: true
        shell: bash
        run: |
          stage="$REPORT_ROOT/05-release-build"
          assets="$stage/assets"
          mkdir -p -- "$assets"
          exec > >(tee "$stage/release-build.log") 2>&1

          rc=0
          version="${{ steps.metadata.outputs.version }}"
          if [[ -z $version || $version == unknown ]]; then
            printf 'Cannot determine module version.\n' >&2
            rc=1
          fi

          if ((rc == 0)); then
            bash scripts/build-release.sh "$assets" || rc=$?
          fi

          zip="$assets/otast-${version}.zip"
          sidecar="$zip.sha256"
          if ((rc == 0)); then
            [[ -f $zip && -f $sidecar ]] || {
              printf 'Expected release ZIP/sidecar missing for %s.\n' "$version" >&2
              rc=1
            }
          fi
          if ((rc == 0)); then
            (
              cd -- "$assets" &&
              sha256sum -c "otast-${version}.zip.sha256"
            ) || rc=$?
          fi
          if ((rc == 0)); then
            sha256sum "$zip" | tee "$stage/module-sha256.txt" || rc=$?
            unzip -l "$zip" >"$stage/zip-contents.txt" || rc=$?
            unzip -p "$zip" module.prop >"$stage/built-module.prop" || rc=$?
            unzip -p "$zip" release.properties >"$stage/release.properties" || rc=$?
          fi

          {
            printf 'version=%s\n' "$version"
            printf 'source_head=%s\n' "${{ steps.metadata.outputs.head }}"
            printf 'zip=%s\n' "$zip"
            printf 'sha_sidecar=%s\n' "$sidecar"
          } >"$stage/build-manifest.txt"

          printf '%s\n' "$rc" >"$stage/rc"
          exit "$rc"

      - name: Upload release-build evidence
        id: upload_build
        if: always() && inputs.build_release_asset
        uses: actions/upload-artifact@v4
        with:
          name: readiness-05-release-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_ROOT }}/05-release-build
          if-no-files-found: warn
          retention-days: 14

      - name: Inspect GitHub release and recent main CI state
        id: github_state
        continue-on-error: true
        shell: bash
        run: |
          stage="$REPORT_ROOT/06-github-state"
          mkdir -p -- "$stage"
          exec > >(tee "$stage/github-state.log") 2>&1

          rc=0
          version="${{ steps.metadata.outputs.version }}"

          gh api "repos/$GITHUB_REPOSITORY/commits/main" \
            --jq '{sha: .sha, html_url: .html_url, committed_at: .commit.committer.date, message: .commit.message}' \
            >"$stage/main-head.json" || rc=$?

          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow CI \
            --branch main \
            --limit 10 \
            --json databaseId,status,conclusion,createdAt,headSha,url,displayTitle \
            >"$stage/recent-main-ci.json" || rc=$?

          if gh release view "$version" --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease,targetCommitish,url,assets \
              >"$stage/release-state.json" 2>"$stage/release-state.stderr"; then
            printf 'Existing release/draft found for %s.\n' "$version"
          else
            printf '{"status":"NOT_FOUND","version":"%s"}\n' "$version" >"$stage/release-state.json"
            printf 'No existing release/draft for %s; this is normal before first publication.\n' "$version"
          fi

          printf '%s\n' "$rc" >"$stage/rc"
          exit "$rc"

      - name: Upload GitHub-state evidence
        id: upload_github_state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-06-github-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_ROOT }}/06-github-state
          if-no-files-found: warn
          retention-days: 14

      - name: Generate human-readable readiness summary
        id: summary
        if: always()
        shell: bash
        env:
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          VALIDATION_OUTCOME: ${{ steps.full_validation.outcome }}
          PRIVACY_OUTCOME: ${{ steps.privacy_audit.outcome }}
          MONITOR_OUTCOME: ${{ steps.target_monitor.outcome }}
          BUILD_OUTCOME: ${{ steps.build_release.outcome }}
          GITHUB_STATE_OUTCOME: ${{ steps.github_state.outcome }}
          MONITOR_RESULT: ${{ steps.target_monitor.outputs.result }}
          METADATA_URL: ${{ steps.upload_metadata.outputs.artifact-url }}
          TOOLCHAIN_URL: ${{ steps.upload_toolchain.outputs.artifact-url }}
          VALIDATION_URL: ${{ steps.upload_full_validation.outputs.artifact-url }}
          PRIVACY_URL: ${{ steps.upload_privacy.outputs.artifact-url }}
          MONITOR_URL: ${{ steps.upload_target_monitor.outputs.artifact-url }}
          BUILD_URL: ${{ steps.upload_build.outputs.artifact-url }}
          GITHUB_STATE_URL: ${{ steps.upload_github_state.outputs.artifact-url }}
        run: |
          stage="$REPORT_ROOT/99-summary"
          mkdir -p -- "$stage"
          summary="$stage/README.md"

          display_status() {
            case $1 in
              success) printf '✅ PASS' ;;
              failure) printf '❌ FAIL' ;;
              skipped) printf '⏭️ SKIPPED' ;;
              cancelled) printf '⚪ CANCELLED' ;;
              *) printf '⚠️ %s' "${1:-UNKNOWN}" ;;
            esac
          }

          artifact_link() {
            local url label
            url=$1
            label=$2
            if [[ -n $url ]]; then
              printf '[%s](%s)' "$label" "$url"
            else
              printf '%s' '—'
            fi
          }

          monitor_display=$(display_status "${MONITOR_OUTCOME:-skipped}")
          if [[ ${MONITOR_RESULT:-} == REVIEW_REQUIRED ]]; then
            monitor_display='⚠️ REVIEW REQUIRED'
          elif [[ ${MONITOR_RESULT:-} == SUPPORTED ]]; then
            monitor_display='✅ SUPPORTED'
          fi

          {
            printf '# OTAST Release Readiness\n\n'
            printf '**Source:** latest `main` at `%s`  \n' "${{ steps.metadata.outputs.head }}"
            printf '**Module version:** `%s`  \n' "${{ steps.metadata.outputs.version }}"
            printf '**Run:** [%s/%s](%s/%s/actions/runs/%s)  \n\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"

            printf '| Stage | Result | Download evidence |\n'
            printf '|---|---|---|\n'
            printf '| Source metadata | %s | %s |\n' \
              "$(display_status "$METADATA_OUTCOME")" "$(artifact_link "$METADATA_URL" 'metadata')"
            printf '| Validation toolchain | %s | %s |\n' \
              "$(display_status "$TOOLCHAIN_OUTCOME")" "$(artifact_link "$TOOLCHAIN_URL" 'toolchain log')"
            printf '| Full repository + fake-root gate | %s | %s |\n' \
              "$(display_status "$VALIDATION_OUTCOME")" "$(artifact_link "$VALIDATION_URL" 'full validation log')"
            printf '| Public privacy audit | %s | %s |\n' \
              "$(display_status "$PRIVACY_OUTCOME")" "$(artifact_link "$PRIVACY_URL" 'privacy JSON + log')"
            printf '| Reviewed upstream targets | %s | %s |\n' \
              "$monitor_display" "$(artifact_link "$MONITOR_URL" 'target monitor report')"
            printf '| Release ZIP build + inspection | %s | %s |\n' \
              "$(display_status "$BUILD_OUTCOME")" "$(artifact_link "$BUILD_URL" 'release ZIP + build log')"
            printf '| GitHub release/main-CI state | %s | %s |\n' \
              "$(display_status "$GITHUB_STATE_OUTCOME")" "$(artifact_link "$GITHUB_STATE_URL" 'GitHub state JSON/log')"

            printf '\n## Interpretation\n\n'
            printf -- '- GitHub validates **source/build/fake-root/upstream readiness** only.\n'
            printf -- '- The physical Pixel lifecycle remains `otast release`; this hosted workflow cannot reboot or inspect the phone.\n'
            printf -- '- `REVIEW REQUIRED` from the target monitor is surfaced as attention-needed evidence, not disguised as an infrastructure failure.\n'
            printf -- '- Every stage above retains its raw stdout/stderr or generated reports as a downloadable artifact.\n'

            printf '\n## Native Actions log\n\n'
            printf '[Open this workflow run](%s/%s/actions/runs/%s) for GitHub-native per-step logs.\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } | tee "$summary"

          cat "$summary" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload combined readiness bundle
        id: upload_combined
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-all-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_ROOT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Add combined bundle link
        if: always()
        shell: bash
        env:
          COMBINED_URL: ${{ steps.upload_combined.outputs.artifact-url }}
        run: |
          {
            printf '\n## Complete evidence bundle\n\n'
            if [[ -n $COMBINED_URL ]]; then
              printf '[Download all readiness logs/reports/artifacts](%s)\n' "$COMBINED_URL"
            else
              printf 'Combined artifact upload did not produce a URL. Use the run Artifacts section.\n'
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Final readiness verdict
        if: always()
        shell: bash
        env:
          FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          VALIDATION_OUTCOME: ${{ steps.full_validation.outcome }}
          PRIVACY_OUTCOME: ${{ steps.privacy_audit.outcome }}
          MONITOR_OUTCOME: ${{ steps.target_monitor.outcome }}
          BUILD_OUTCOME: ${{ steps.build_release.outcome }}
          GITHUB_STATE_OUTCOME: ${{ steps.github_state.outcome }}
        run: |
          failures=0

          for result in \
            "$METADATA_OUTCOME" \
            "$TOOLCHAIN_OUTCOME" \
            "$VALIDATION_OUTCOME" \
            "$PRIVACY_OUTCOME" \
            "$GITHUB_STATE_OUTCOME"; do
            [[ $result == success ]] || failures=$((failures + 1))
          done

          if [[ '${{ inputs.build_release_asset }}' == true && $BUILD_OUTCOME != success ]]; then
            failures=$((failures + 1))
          fi
          if [[ '${{ inputs.include_target_monitor }}' == true && $MONITOR_OUTCOME != success ]]; then
            failures=$((failures + 1))
          fi

          if ((failures == 0)); then
            printf 'RELEASE READINESS: PASS\n'
            exit 0
          fi

          printf 'RELEASE READINESS: %s critical stage(s) failed. Evidence was uploaded above.\n' "$failures" >&2
          if [[ $FAIL_ON_ERROR == true ]]; then
            exit 1
          fi
          printf 'fail_on_error=false: retaining an informational successful workflow conclusion.\n'
          exit 0
