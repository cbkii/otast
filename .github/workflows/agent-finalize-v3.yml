name: Agent Finalize V3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'agent/final-upstream-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/final-upstream-refresh
          fetch-depth: 0
          persist-credentials: true

      - name: Patch exact reviewed anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/otast-maintenance.py')
          text = path.read_text(encoding='utf-8')

          marker = '\n\ndef review_markdown(value: dict[str, Any]) -> str:\n'
          helper = (
              '\n\ndef classify_review_result(\n'
              '    comparison: dict[str, Any],\n'
              '    *,\n'
              '    active_candidate_compare_rc: int,\n'
              '    report_rc: int,\n'
              '    preflight_rc: int,\n'
              ') -> tuple[bool, str, int, str]:\n'
              '    """Classify immutable upstream-package review evidence.\n\n'
              '    An old/new module tree that is byte/mode identical is package-neutral. The\n'
              '    staged source tree may not model installer-derived runtime topology (notably\n'
              "    TA-UTL's visible ``TA_utl`` source versus hidden ``.TA_utl`` install form),\n"
              '    so staged Preflight remains diagnostic in that case rather than a gate.\n\n'
              '    Changed package trees always require compatibility review. Comparison/report\n'
              '    execution failures remain fail-closed validation errors.\n'
              '    """\n'
              '    identical = comparison.get("identical") is True\n'
              '    evidence_ok = active_candidate_compare_rc == 0 and report_rc == 0\n\n'
              '    if not identical:\n'
              '        return False, "PACKAGE_CHANGED", EXIT_REVIEW, "REQUIRED_FOR_CHANGED_PACKAGE"\n'
              '    if not evidence_ok:\n'
              '        return False, "VALIDATION_FAILED", EXIT_ERROR, "DIAGNOSTIC_ONLY_FOR_IDENTICAL_PACKAGE"\n'
              '    return True, "NO_PACKAGE_IMPACT", EXIT_OK, "DIAGNOSTIC_ONLY_FOR_IDENTICAL_PACKAGE"\n'
          )
          if 'def classify_review_result(' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('review_markdown anchor is not unique')
              text = text.replace(marker, helper + marker, 1)

          old_line = '        f"- Preflight status: `{value[\'preflight_rc\']}`",\n'
          new_line = old_line + '        f"- Preflight policy: `{value[\'preflight_policy\']}`",\n'
          if 'Preflight policy:' not in text:
              if text.count(old_line) != 1:
                  raise SystemExit('preflight Markdown anchor is not unique')
              text = text.replace(old_line, new_line, 1)

          old_block = (
              '    acceptance_ready = (\n'
              '        comparison["identical"]\n'
              '        and active_compare.returncode == 0\n'
              '        and report.returncode == 0\n'
              '        and preflight.returncode == 0\n'
              '    )\n'
              '    if acceptance_ready:\n'
              '        result_name = "NO_PACKAGE_IMPACT"\n'
              '        rc = EXIT_OK\n'
              '    elif not comparison["identical"]:\n'
              '        result_name = "PACKAGE_CHANGED"\n'
              '        rc = EXIT_REVIEW\n'
              '    else:\n'
              '        result_name = "VALIDATION_FAILED"\n'
              '        rc = EXIT_ERROR\n'
          )
          new_block = (
              '    acceptance_ready, result_name, rc, preflight_policy = classify_review_result(\n'
              '        comparison,\n'
              '        active_candidate_compare_rc=active_compare.returncode,\n'
              '        report_rc=report.returncode,\n'
              '        preflight_rc=preflight.returncode,\n'
              '    )\n'
          )
          if old_block in text:
              if text.count(old_block) != 1:
                  raise SystemExit('classifier block is not unique')
              text = text.replace(old_block, new_block, 1)
          elif new_block not in text:
              raise SystemExit('classifier block matches neither reviewed form')

          anchor = '        "preflight_rc": preflight.returncode,\n'
          replacement = anchor + '        "preflight_policy": preflight_policy,\n'
          if '"preflight_policy": preflight_policy' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('review JSON anchor is not unique')
              text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

          path = Path('docs/MAINTENANCE.md')
          text = path.read_text(encoding='utf-8')
          old = '- `NO_PACKAGE_IMPACT`: old and new module package trees are byte/mode identical and fake-root validation passed;'
          new = '- `NO_PACKAGE_IMPACT`: old and new immutable module package trees are byte/mode identical and comparison/Report evidence is valid; staged Preflight is retained as diagnostic evidence when static source topology cannot model installer-derived runtime topology;'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('maintenance documentation anchor missing')
          path.write_text(text, encoding='utf-8', newline='\n')

          path = Path('docs/PIF-COMPATIBILITY.md')
          text = path.read_text(encoding='utf-8')
          old = 'For the reviewed PIF Inject source at commit `ea93222c58f90108cef0c02a11e66bdfdf4b21b6`, OTAST manages only:'
          new = 'For the reviewed PIF Inject source lineage at commits `ea93222c58f90108cef0c02a11e66bdfdf4b21b6` and `8b4a00cef9536dc9c8428d392725eacf364605a9`, OTAST manages only:'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('PIF lineage anchor missing')
          surface = '- `security_patch.sh` — exact wrapper because OTAST owns the same TrickyStore and runtime security-patch outputs.\n'
          note = '\nThe `8b4a00ce` review changes only AutoPIF Pixel download-page selection (reverse-sorted FI/OTA URLs). The OTAST transformation anchors and managed writer surfaces are unchanged; the exact new `autopif.sh` source hash is retained as a regression fixture and allowlisted alongside the earlier reviewed sources.\n'
          if note.strip() not in text:
              if text.count(surface) != 1:
                  raise SystemExit('PIF surface anchor is not unique')
              text = text.replace(surface, surface + note, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git diff --check

      - name: Focused proof
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static
          python3 -m py_compile scripts/otast-maintenance.py tests/test_maintenance.py tests/test_profiles.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v \
            tests.test_maintenance.MaintenanceTests.test_review_classifier_treats_identical_package_preflight_as_diagnostic \
            tests.test_profiles.ProfileTests.test_reviewed_writer_fixtures_match_allowlists \
            tests.test_profiles.ProfileTests.test_current_pif_autopif_transform_preserves_authority_contract

      - name: Commit reviewed source patch
        shell: bash
        run: |
          expected=$'docs/MAINTENANCE.md\ndocs/PIF-COMPATIBILITY.md\nscripts/otast-maintenance.py'
          actual=$(git diff --name-only | LC_ALL=C sort)
          [[ "$actual" == "$expected" ]] || {
            printf 'Unexpected patch scope:\n%s\n' "$actual" >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MAINTENANCE.md docs/PIF-COMPATIBILITY.md scripts/otast-maintenance.py
          git commit -m 'fix(maintenance): classify package-neutral reviews correctly'
          git push origin HEAD:agent/final-upstream-refresh
