name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install pinned shell validators
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static curl xz-utils unzip zip

          archive="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          extracted="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 300 \
            --output "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"

          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" |
            sha256sum -c -

          tar -xJf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$extracted/shellcheck" /usr/local/bin/shellcheck

          shellcheck --version
          printf '#!/bin/sh\nexit 0\n' >"$RUNNER_TEMP/shellcheck-busybox-probe.sh"
          shellcheck --shell=busybox "$RUNNER_TEMP/shellcheck-busybox-probe.sh"

      - name: Full repository and fake-root gate
        run: bash scripts/test.sh --full

      - name: Build exact deliverable and provenance
        id: exact_build
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          rm -rf -- dist
          python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" build-release \
            --output dist --commit-sha "$SOURCE_COMMIT" >dist-build.json
          python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" verify-release \
            --zip "dist/$(python3 -c 'import json; print(json.load(open("dist/release-manifest.json"))["zip_filename"])')" \
            --checksum "dist/$(python3 -c 'import json; print(json.load(open("dist/release-manifest.json"))["checksum_filename"])')" \
            --manifest dist/release-manifest.json >dist-verify.json
          python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" runtime-digest \
            --zip "dist/$(python3 -c 'import json; print(json.load(open("dist/release-manifest.json"))["zip_filename"])')" \
            >runtime-digest.json
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          manifest=json.loads(Path('dist/release-manifest.json').read_text())
          with zipfile.ZipFile(Path('dist')/manifest['zip_filename']) as archive:
              inventory=[]
              for item in archive.infolist():
                  if item.is_dir():
                      continue
                  inventory.append({
                      'path': item.filename,
                      'mode': f"{((item.external_attr >> 16) & 0o777):04o}",
                      'size': item.file_size,
                  })
          Path('zip-inventory.json').write_text(json.dumps(inventory, indent=2, sort_keys=True)+'\n')
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as out:
              out.write('## Exact deliverable\n\n')
              out.write(f"- source: `{manifest['source_commit']}`\n")
              out.write(f"- ZIP SHA-256: `{manifest['zip_sha256']}`\n")
              out.write(f"- runtime digest: `{manifest['runtime_digest']}`\n")
          PY

      - name: Upload exact CI evidence
        if: ${{ always() && steps.exact_build.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-deliverable-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/
            dist-build.json
            dist-verify.json
            runtime-digest.json
            zip-inventory.json
          if-no-files-found: warn
          retention-days: 30
