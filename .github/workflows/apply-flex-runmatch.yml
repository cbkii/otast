name: Apply Flexible Release Run Matcher

on:
  push:
    branches:
      - agent/flexible-self-healing-release

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/flexible-self-healing-release
          fetch-depth: 0

      - name: Apply exact run matching patch
        shell: bash
        run: |
          printf '%s  %s\n' 'e1ffcd9b10fc9ca27d71d9ca06ecfb4587aa2c70472362451341f628f2751aab' .agent-flex-release/runmatch.patch | sha256sum -c -
          git apply --check .agent-flex-release/runmatch.patch
          git apply .agent-flex-release/runmatch.patch
          git diff --check
          bash -n scripts/release-device.sh

      - name: Validate patch
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m tools.otastctl --repo-root "$GITHUB_WORKSPACE" privacy-scan --json

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/release-device.sh tests/test_release_device.py
          git diff --cached --check
          git commit -m 'fix(release): bind workflow polling to dispatch time'
          git push origin HEAD:agent/flexible-self-healing-release
